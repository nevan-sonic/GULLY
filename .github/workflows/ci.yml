name: GULLY Protocol CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Track 11 60-Day Tokenomics Simulation
        run: python simulate_gully_rush.py

      - name: Run Cargo Smart Contract Unit & Integration Tests
        run: cargo test --all

      - name: Run Hackathon AI Verification Test Suite (npm test)
        run: npm test
